<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- rounded piece tile -->
  <rect x="3" y="3" width="58" height="58" rx="13" fill="#f8f0e0" stroke="#8a6820" stroke-width="3"/>
  <!-- ears -->
  <circle cx="19" cy="20" r="6" fill="#d99a2a"/>
  <circle cx="45" cy="20" r="6" fill="#d99a2a"/>
  <!-- mane: fluffy ring of bumps -->
  <g fill="#e3a52e">
    <circle cx="52" cy="34" r="6.2"/>
    <circle cx="49.3" cy="44" r="6.2"/>
    <circle cx="42" cy="51.3" r="6.2"/>
    <circle cx="32" cy="54" r="6.2"/>
    <circle cx="22" cy="51.3" r="6.2"/>
    <circle cx="14.7" cy="44" r="6.2"/>
    <circle cx="12" cy="34" r="6.2"/>
    <circle cx="14.7" cy="24" r="6.2"/>
    <circle cx="22" cy="16.7" r="6.2"/>
    <circle cx="32" cy="14" r="6.2"/>
    <circle cx="42" cy="16.7" r="6.2"/>
    <circle cx="49.3" cy="24" r="6.2"/>
    <circle cx="32" cy="34" r="20"/>
  </g>
  <!-- face -->
  <circle cx="32" cy="34" r="15.5" fill="#f7ead1"/>
  <!-- eyes -->
  <ellipse cx="25.8" cy="32" rx="2.4" ry="3.1" fill="#2a1a0a"/>
  <ellipse cx="38.2" cy="32" rx="2.4" ry="3.1" fill="#2a1a0a"/>
  <!-- nose -->
  <path d="M32 39.5 l-3.4-3.6 h6.8 z" fill="#c05a20"/>
  <!-- mouth -->
  <path d="M32 39.5 v3.2 M32 42.7 q-3 2.4-6 0 M32 42.7 q3 2.4 6 0"
        fill="none" stroke="#7a5a1a" stroke-width="1.6" stroke-linecap="round"/>
  <!-- whisker dots -->
  <circle cx="22.5" cy="39" r="0.9" fill="#b98a3a"/>
  <circle cx="41.5" cy="39" r="0.9" fill="#b98a3a"/>
</svg>
