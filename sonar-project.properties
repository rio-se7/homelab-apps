# SonarQube analysis config — see .github/workflows/sonar.yml
#
# Community Build has no monorepo concept: this whole repo is analyzed as a
# single project (projectKey=homelab-apps). Update sonar.sources and
# sonar.rust.cargo.manifestPaths below when a WIP app (briefcast, rsscast,
# mahjong-trainer, ...) is promoted to main — see docs/NOTES.md "App Status".
sonar.projectKey=homelab-apps
sonar.sourceEncoding=UTF-8

# Only *.rs / *.ts(x) / *.js under each app's own src/ — build artifacts,
# node_modules, and vendored data live outside src/ so no exclusions needed.
sonar.sources=\
  dobutsu-analyzer/backend/src,\
  dobutsu-analyzer/frontend/src,\
  dobutsu-record/backend/src,\
  dobutsu-record/frontend/src,\
  suiso/backend/src,\
  suiso/frontend/src

# Rust analyzer needs each crate's manifest to run Clippy and resolve deps.
# See docs.sonarsource.com/sonarqube-community-build/analyzing-source-code/languages/rust/
# — Clippy analysis is automatic as long as cargo + clippy are on PATH
# (installed by the sonar.yml workflow before the scan step).
sonar.rust.cargo.manifestPaths=\
  dobutsu-analyzer/backend/Cargo.toml,\
  dobutsu-record/backend/Cargo.toml,\
  suiso/backend/Cargo.toml

# Fail the CI job (PR check) when the quality gate fails, not just report it.
sonar.qualitygate.wait=true

# JS/TS coverage. vitest (v8 provider) writes lcov for dobutsu-analyzer/frontend;
# the sonar.yml workflow runs `vitest run --coverage` before the scan. Test files
# are auto-detected by SonarQube (name contains ".test.") so sonar.tests need not
# be set. Add each app's lcov path here as it grows a test suite.
sonar.javascript.lcov.reportPaths=dobutsu-analyzer/frontend/coverage/lcov.info

# Coverage MEASUREMENT exclusions (files are still analyzed for issues). Pure-logic
# unit tests can't reach React component wiring, and the quality gate's 80%
# new-code-coverage bar would otherwise red-gate every frontend PR. Exclude UI /
# entrypoints and the shared test helper.
sonar.coverage.exclusions=**/App.tsx,**/main.tsx,**/components/**,**/quiz/QuizPanel.tsx,**/testkit.ts

# Suppress pre-existing structural debt on the two god-components (App.tsx,
# QuizPanel.tsx): their Cognitive Complexity (S3776) and App.tsx's chained render
# ternary (S3358) predate any single PR — merely editing these files re-flags them
# as "new issues". Splitting them into smaller components is tracked separately
# (roadmap #22); it must not block feature PRs. Scoped to these files only.
sonar.issue.ignore.multicriteria=cc1,cc2,nt1
sonar.issue.ignore.multicriteria.cc1.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.cc1.resourceKey=**/App.tsx
sonar.issue.ignore.multicriteria.cc2.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.cc2.resourceKey=**/quiz/QuizPanel.tsx
sonar.issue.ignore.multicriteria.nt1.ruleKey=typescript:S3358
sonar.issue.ignore.multicriteria.nt1.resourceKey=**/App.tsx
