name: SonarQube analysis

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Manual baseline re-run. Note: the community-branch-plugin refuses PR
  # analysis until a main-branch analysis exists, so the first PR that adds
  # this workflow inevitably has a red sonar check — merge it, let the push
  # analysis establish the baseline, and every later PR analyzes normally.
  workflow_dispatch:

# One analysis at a time. The scanner and the SonarQube server it uploads to
# share a single 2 vCPU / 12 GiB node, and on 2026-07-30 an analysis drove the
# node into an I/O stall (MemAvailable 1.3Gi, disk util 90%, PSI io full stall
# 0.73) — kubelet's probes timed out and every pod's container was restarted,
# taking CoreDNS with them. Queue runs instead of overlapping them; superseded
# runs are not cancelled so a main-branch baseline always completes.
concurrency:
  group: sonar
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # The Rust sensor runs `cargo clippy` inside the scanner process; cap the
  # parallel rustc jobs so peak memory stays inside the runner pod's limit
  # (scanner JVMs + Node already take ~700Mi of it).
  CARGO_BUILD_JOBS: "2"
  # Bound the scanner JVM explicitly rather than letting it size itself from
  # the node's total RAM. SONAR_SCANNER_JAVA_OPTS is the scanner-CLI >= 6.0
  # variable (the action runs 8.x); SONAR_SCANNER_OPTS is the pre-6.0 name.
  SONAR_SCANNER_JAVA_OPTS: "-Xmx512m"

permissions:
  contents: read

jobs:
  sonar:
    # Fork PRs don't get repo secrets (SONAR_TOKEN) — skip rather than fail.
    # Pushes to main and same-repo PRs proceed as normal.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: homelab-apps
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: sonar.scm.revision / new-code-since-baseline diffing
          # needs more than the default shallow clone.
          fetch-depth: 0

      - name: Install analysis prerequisites
        # Minimal ARC runner image lacks all of these:
        # - dirmngr: gpg keyserver access for the scanner signature check
        # - build-essential/pkg-config/libssl-dev: C linker + headers so
        #   Clippy can compile crate build scripts (proc-macro2 etc.)
        run: >-
          sudo apt-get update -qq &&
          sudo apt-get install -y -qq --no-install-recommends
          dirmngr build-essential pkg-config libssl-dev

      - name: Install Node.js (JS/TS analysis)
        # The JS/TS sensor needs a Node.js runtime on PATH.
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust toolchain (clippy)
        # dobutsu-analyzer, dobutsu-record, suiso backends are analyzed by the
        # Rust analyzer, which runs Clippy automatically as long as cargo +
        # clippy are on PATH — no separate `cargo clippy` report step needed.
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo (backend crates)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            dobutsu-analyzer/backend
            dobutsu-record/backend
            suiso/backend

      - name: Generate frontend coverage (JS/TS lcov for SonarQube)
        # dobutsu-analyzer/frontend has a vitest suite; produce lcov before the
        # scan so sonar.javascript.lcov.reportPaths has a report to ingest. Runs
        # for both PR and baseline analyses. Add other frontends here as they
        # grow test suites.
        working-directory: dobutsu-analyzer/frontend
        run: |
          npm ci
          # Type-check with the same command the Dockerfile build uses (tsc -b).
          # `tsc --noEmit` on the solution tsconfig checks nothing (it only holds
          # project references), so without this a type error surfaces only at
          # image-build time on main — after the PR is already merged.
          npx tsc -b
          npx vitest run --coverage
          # The scanner runs at the repo root, but v8 writes lcov source paths
          # relative to this dir (SF:src/...). Rewrite them to repo-root-relative
          # so SonarQube maps coverage onto the real files.
          sed -i 's|^SF:src/|SF:dobutsu-analyzer/frontend/src/|' coverage/lcov.info

      - name: SonarQube scan (PR analysis)
        if: github.event_name == 'pull_request'
        uses: SonarSource/sonarqube-scan-action@v8.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
            -Dsonar.pullrequest.branch=${{ github.head_ref }}
            -Dsonar.pullrequest.base=${{ github.base_ref }}
            -Dsonar.scm.revision=${{ github.event.pull_request.head.sha }}

      - name: SonarQube scan (main baseline)
        if: github.event_name != 'pull_request'
        uses: SonarSource/sonarqube-scan-action@v8.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.branch.name=main
