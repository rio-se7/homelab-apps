name: dobutsu-analyzer build

on:
  push:
    branches: [main]
    paths:
      - 'dobutsu-analyzer/backend/**'
      - 'dobutsu-analyzer/frontend/**'
      - '.github/workflows/dobutsu-analyzer.yml'

env:
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  packages: write

jobs:
  backend:
    runs-on: homelab-apps
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Build and push backend image
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/${{ github.repository_owner }}/dobutsu-analyzer-backend"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" dobutsu-analyzer/backend
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  frontend:
    runs-on: homelab-apps
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Build and push frontend image
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/${{ github.repository_owner }}/dobutsu-analyzer-frontend"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" dobutsu-analyzer/frontend
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  bump:
    needs: [backend, frontend]
    uses: ./.github/workflows/bump-fleet.yml
    with:
      app: dobutsu-analyzer
    secrets:
      BUMP_APP_ID: ${{ secrets.BUMP_APP_ID }}
      BUMP_APP_PRIVATE_KEY: ${{ secrets.BUMP_APP_PRIVATE_KEY }}
